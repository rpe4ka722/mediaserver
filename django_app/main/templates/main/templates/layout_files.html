{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
    <meta charset="utf-8">
    <title>{% block title %}{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'main/styles.css' %}">
    <link rel="stylesheet" href="{% static 'main/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'main/icons/font/bootstrap-icons.css' %}">
    <script src="{% static 'scripts/jquery.min.js' %}"></script>
    <script src="{% static 'scripts/htmx.min.js' %}"></script>
    <script src="{% static 'scripts/bootstrap.min.js' %}"></script>
    <script src="{% static 'scripts/bootstrap.bundle.js' %}"></script>
    <!-- Custom styles for this template -->
</head>
<body class="files_body">
    <ul class="nav justify-content-around nav-tabs align-items-end" style="background-color: #e3f2fd;">
        <div class="nav-item">
        <a class="navbar-brand" href="{% url 'main:index' %}">
           <img src="{% static 'main/logotip-gazprom-transgaz-surgut-v-krivykh.png' %}" width="100">
        </a>
        </div>
        <li class="nav-item">
        <a class="nav-link" aria-current="page" href="{% url 'main:index' %}">Главная</a>
        </li>
        <li class="nav-item">
        <a class="nav-link" href="{% url 'main:camera' %}">Управление видеокамерами</a>
        </li>
        <li class="nav-item">
        <a class="nav-link" href="{% url 'main:config' %}">Информация</a>
        </li>
        <li class="nav-item">
        <a class="nav-link active" href="{% url 'main:camera_records' %}">Записи</a>
        </li>
        <li class="nav-item">
        <a class="nav-link" href="{% url 'account:index' %}">Управление пользователями</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{% url 'account:logout' %}">Выйти</a>
        </li>
    </ul>
    {% block content %}
    {% endblock %}
    
</body>
    <footer class="footer mt-auto py-2 bg-light fixed-bottom" >
        <div class="input-group mb-3">
        <span class="input-group-text mx-1" id="basic-addon1"><i class="bi bi-funnel"></i></span>
        <div class="w-25">
            <input type="text" id="searchInput" class="form-control" placeholder="Фильтр" aria-label="Фильтр" aria-describedby="basic-addon1">
        </div>
        </div>
    </footer>
{% if messages %}
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="alert" aria-label="Закрыть"><i class="bi bi-x-lg"></i></button>
    </div>
  {% endfor %}
{% endif %}
<script src="{% static 'scripts/files.js' %}?v=0.1" defer></script>
</html>
<!--\\\ -->
