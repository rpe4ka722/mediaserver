{% extends "main/templates/layout_config.html" %}
{% load static %}
{% block title %}{% endblock %}
{% block content %}
<div class="button-panel">
  <div class="d-flex align-items-center">
    <span id="server-status-lamp" class="me-2" style="width: 12px; height: 12px; border-radius: 50%; background-color: gray;"> </span>
    <small id="server-status-text"> Проверка сервера...</small>
  </div>
</div>

<!-- Содержание тела -->
<div class="card_wrapper">
    {% for camera in cameras %}
    <div id="camera_card_{{ camera.id }}" class="camera-monitor-card" data-camera-id="{{ camera.id }}">
      <div class="card shadow-sm">
        <div class="card-body">
            
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div id="rec_status_wrapper_{{ camera.id }}" {% if not camera.is_recording %}style="display:none;"{% endif %}>
                <div class="rec-indicator">
                    <div class="rec-dot"></div>
                    <span>REC</span>
                </div>
            </div>
            <div class="camera-status-badge ms-auto">
                <span class="status-lamp green"></span>
                <span class="status-text text-muted">В сети</span>
            </div>
          </div>

          <div class="card_logo text-center my-3">
            <img src="{% static 'main/camera_icon.png' %}" height="50" alt="Camera">
          </div>
          
          <h5 class="card-title mt-2">{{ camera.name }}</h5>
          <p class="card-text text-secondary small">{{ camera.description }}</p>
          
          <div class="mt-3 pt-2 border-top d-flex justify-content-between">
            <span class="text-muted small"><i class="bi bi-speedometer2 me-1"></i> Битрейт:</span>
            <strong class="camera-bitrate-value text-dark">—</strong>
          </div>

          <div class="mt-3 pt-2 border-top text-center">
            <form action="{% url 'main:toggle_record' camera.id %}" method="POST" class="record-form">
              {% csrf_token %}
              <button type="submit" class="btn {% if camera.is_recording %}btn-danger{% else %}btn-outline-danger{% endif %} btn-sm w-100" id="btn_rec_{{ camera.id }}">
                <i class="bi {% if camera.is_recording %}bi-stop-circle-fill{% else %}bi-record-circle-fill{% endif %} me-2"></i> 
                {{ camera.is_recording|yesno:"Остановить запись,Начать запись" }}
              </button>
            </form>
          </div>

          <div class="camera-onvif-info mt-3">
            <div class="d-flex justify-content-between border-top pt-2">
                <span class="text-muted small">Качество:</span>
                <span class="camera-onvif-res text-dark small font-monospace">—</span>
            </div>
            <div class="d-flex justify-content-between">
                <span class="text-muted small">FPS:</span>
                <span class="camera-onvif-fps text-dark small font-monospace">—</span>
            </div>
            <div class="mt-2">
                <select class="form-select form-select-sm mb-1 camera-res-select" data-camera-id="{{ camera.id }}" onchange="changeCameraRes(this)">
                    <option value="" disabled selected>Разрешение...</option>
                </select>
                <select class="form-select form-select-sm camera-fps-select" data-camera-id="{{ camera.id }}" onchange="applyCameraSettings(this)">
                  <option value="" disabled selected>FPS...</option>
                </select>
            </div>
          </div>

        </div>
      </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
