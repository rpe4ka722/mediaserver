worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024; # increase if you have lots of clients
}

http {
  include mime.types;
  # fallback in case we can't determine a type
  default_type application/octet-stream;
  access_log /dev/null;
  sendfile on;


  server {
    listen 80;
    client_max_body_size 1024M;

    access_log /dev/stdout;
    error_log /dev/stderr info;

    server_name localhost;

    keepalive_timeout 5;

    location / {
      proxy_pass http://django_app:8000;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
      proxy_redirect off;
    }


    location /static {
      # checks for static file
      alias /opt/mediaserver/django_app/static;
    }

    location /protected_recordings {
        # Путь внутри контейнера Nginx к твоим видео
        alias /opt/mediaserver/django_app/recordings/;
        
        # Доступ к этой локации разрешен ТОЛЬКО изнутри самого бэкенда Django
        internal; 
        
        # Опционально: оптимизация для отдачи тяжелых медиафайлов
        mp4;
        mp4_buffer_size     1m;
        mp4_max_buffer_size 5m;
    }

  }
}