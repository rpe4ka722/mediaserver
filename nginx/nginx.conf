worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024; # increase if you have lots of clients
}

http {
  include mime.types;
  # fallback in case we can't determine a type
  default_type application/octet-stream;
  access_log /dev/null;
  sendfile on;


  server {
    listen 80;
    client_max_body_size 1024M;

    access_log /dev/stdout;
    error_log /dev/stderr info;

    server_name localhost;

    keepalive_timeout 5;

    location / {
      proxy_pass http://django_app:8000;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
      proxy_redirect off;
    }

    # Внутренний subrequest к Django: доступ к WebRTC получают только
    # пользователи с действующей Django-сессией.
    location = /internal/stream-auth/ {
      internal;
      proxy_pass http://django_app:8000/internal/stream-auth/;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Host $host;
      proxy_set_header X-Original-URI $request_uri;
    }

    location /streams/ {
      auth_request /internal/stream-auth/;
      proxy_pass http://mediamtx:8889/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_redirect off;
    }


    location /static {
      # checks for static file
      alias /opt/mediaserver/django_app/static;
    }

    location /protected_recordings {
        # Путь внутри контейнера Nginx к твоим видео
        alias /opt/mediaserver/django_app/recordings/;
        
        # Доступ к этой локации разрешен ТОЛЬКО изнутри самого бэкенда Django
        internal; 
        
        # Опционально: оптимизация для отдачи тяжелых медиафайлов
        mp4;
        mp4_buffer_size     1m;
        mp4_max_buffer_size 5m;
    }

  }
}
