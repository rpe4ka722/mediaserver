###############################################
# Базовые настройки сервера
###############################################

# Уровень логирования (info, warn, error, debug)
logLevel: info

# API для управления сервером (нужно для Django)
api: yes
apiAddress: 0.0.0.0:9997


# Настройки для браузеров (WebRTC)
webrtc: yes
webrtcAddress: :8889

# Если сервер за NAT, раскомментируй и укажи внешний IP:
# webrtcICEUDPServerAddress: 1.2.3.4:8189

# Настройки RTSP (для приема потоков с камер)
rtsp: yes
rtspAddress: :8554

# Настройки HLS (для Safari/iOS)
hls: yes
hlsAddress: :8888


authInternalUsers:
- user: any
  pass:
  ips: []
  permissions:
  - action: publish
    path:
  - action: read
    path:
  - action: playback
    path:
  - action: api

# - user: myuser
#   pass: mypass
#   ips: []
#   permissions:
#   - action: api
#   - action: metrics
#   - action: pprof

###############################################
# Настройки путей (камер)
###############################################

paths:
  all:
    sourceProtocol: tcp
    record: no  
    recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S
    recordFormat: fmp4

    # Строго проверенный асинхронный хук (в одну строчку без переносов!)
    runOnRecordSegmentCreate: sh -c "wget --post-data=\"path=$MTX_PATH&file=$MTX_FILE_PATH\" --timeout=5 -O - http://nginx/archive/webhook/record-created/ || echo 'failed'"
    runOnRecordSegmentComplete: sh -c "wget --post-data=\"path=$MTX_PATH&file=$MTX_FILE_PATH\" --timeout=5 -O - http://nginx/archive/webhook/record-created/ || echo 'failed'"