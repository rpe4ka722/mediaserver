###############################################
# Базовые настройки сервера
###############################################

# Уровень логирования (info, warn, error, debug)
logLevel: info

# API для управления сервером (нужно для Django)
api: yes
apiAddress: 0.0.0.0:9997


# Настройки для браузеров (WebRTC)
webrtc: yes
webrtcAddress: :8889

# Если сервер за NAT, раскомментируй и укажи внешний IP:
# webrtcICEUDPServerAddress: 1.2.3.4:8189

# Настройки RTSP (для приема потоков с камер)
rtsp: yes
rtspAddress: :8554

# Настройки HLS (для Safari/iOS)
hls: yes
hlsAddress: :8888


authMethod: internal
authInternalUsers:
# Учётная запись Django для Control API. Пароль обязательно переопределяется
# переменной MTX_AUTHINTERNALUSERS_0_PASS из docker-compose.yml.
- user: django-api
  pass: disabled-until-overridden
  ips: ["172.30.0.0/24"]
  permissions:
  - action: api

# FFmpeg публикует перекодированный поток только через loopback внутри
# контейнера MediaMTX.
- user: internal-publisher
  pass: disabled-until-overridden
  ips: ["127.0.0.1", "::1"]
  permissions:
  - action: publish
    path:

# Просмотр разрешён только reverse proxy Nginx из Docker-сети. Порт 8889
# с хоста не публикуется, а Nginx проверяет активную Django-сессию.
- user: any
  pass:
  ips: ["172.30.0.0/24"]
  permissions:
  - action: read
    path:
  - action: playback
    path:

###############################################
# Настройки путей (камер)
###############################################

pathDefaults:
  record: no
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  runOnUnread: ""
  runOnRecordSegmentCreate: >-
    curl -fsS --max-time 10 -X POST
    -H "X-MediaMTX-Webhook-Token: $WEBHOOK_TOKEN"
    "http://django-app:8000/archive/webhook/record-created/?path=$MTX_PATH&file=$MTX_SEGMENT_PATH"
  runOnRecordSegmentComplete: >-
    curl -fsS --max-time 10 -X POST
    -H "X-MediaMTX-Webhook-Token: $WEBHOOK_TOKEN"
    "http://django-app:8000/archive/webhook/record-created/?path=$MTX_PATH&file=$MTX_SEGMENT_PATH"

# Cameras are registered explicitly through the Control API.
paths: {}
