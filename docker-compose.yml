services:
  mediamtx:
    image: my_mediamtx
    container_name: mediamtx
    environment:
      - MTX_WEBRTCADDITIONALHOSTS=192.168.1.187
      - MTX_AUTHINTERNALUSERS_0_PASS=${MEDIAMTX_API_PASSWORD:?MEDIAMTX_API_PASSWORD is required}
      - MTX_AUTHINTERNALUSERS_1_PASS=${MEDIAMTX_PUBLISH_PASSWORD:?MEDIAMTX_PUBLISH_PASSWORD is required}
      - PUBLISH_PASSWORD=${MEDIAMTX_PUBLISH_PASSWORD:?MEDIAMTX_PUBLISH_PASSWORD is required}
      - WEBHOOK_TOKEN=${MEDIAMTX_WEBHOOK_TOKEN:?MEDIAMTX_WEBHOOK_TOKEN is required}
    ports:
      - "8890:8890/udp"
      - "8189:8189/udp"
    expose:
      - 8554
      - 9997
      - 8889
    restart: always
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
      - ${VIDEO_RECORDINGS_PATH}:/recordings
    networks:
      - mediaserver_net


  django_app:
    image: django_app
    container_name: django-app
    restart: always
    expose:
      - 8000

    volumes:
      - ./config:/opt/mediaserver/config
      - static_volume:/opt/mediaserver/django_app/static
      - ./media:/opt/mediaserver/django_app/media
      - ${VIDEO_RECORDINGS_PATH}:/opt/mediaserver/django_app/recordings
      - ./django_app/db.sqlite3:/opt/mediaserver/django_app/db.sqlite3
    environment:
      - ENV_PATH=./config/.env
      - MEDIAMTX_API_USERNAME=django-api
      - MEDIAMTX_API_PASSWORD=${MEDIAMTX_API_PASSWORD:?MEDIAMTX_API_PASSWORD is required}
      - MEDIAMTX_WEBHOOK_TOKEN=${MEDIAMTX_WEBHOOK_TOKEN:?MEDIAMTX_WEBHOOK_TOKEN is required}
    cap_add:
      - NET_RAW
    networks:
      - mediaserver_net
    depends_on:
      - mediamtx
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 django_app.wsgi:application

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/opt/mediaserver/django_app/static
      - ./media:/opt/mediaserver/django_app/media
      - ${VIDEO_RECORDINGS_PATH}:/opt/mediaserver/django_app/recordings
    networks:
      - mediaserver_net
    depends_on:
      - django_app
    restart: always

  redis:
    image: redis:alpine
    container_name: django_redis
    expose:
      - 6379
    networks:
      - mediaserver_net
    restart: always

volumes:
  static_volume:

networks:
  mediaserver_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
